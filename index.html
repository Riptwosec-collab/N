<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#020b17" />
  <title>Night Shift Hub</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="hero panel">
      <div>
        <div class="eyebrow"><span class="status-dot"></span> NIGHT SHIFT • D1</div>
        <h1>Night Shift Hub</h1>
        <p>Task form for incident checking, environment monitoring and frequently used work links.</p>
      </div>
      <div class="hero-actions">
        <div id="liveClock" class="clock">--:--:--</div>
        <button class="btn btn-ghost btn-sm" id="resetAllBtn" type="button">Reset</button>
      </div>
    </header>

    <main>
      <section class="panel task-panel"></section>
      <section class="cards-grid"></section>
      <section class="panel custom-links-panel"></section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="./app.js"></script>
  <script src="./section-toggle.js"></script>
  <script src="./secret-link.js"></script>
</body>
</html>
